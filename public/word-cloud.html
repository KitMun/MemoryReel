<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝福墙 - 不负眷顾 终木成林</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', 'PingFang SC', sans-serif;
            background: #F8F6F2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 20px 40px;
            box-shadow: 0 10px 40px rgba(126, 143, 116, 0.15);
            max-width: 1200px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #DCE5DA;
            position: relative;
        }

        h1 {
            text-align: center;
            color: #7E8F74;
            margin-bottom: 5px;
            font-size: 2.5em;
            flex-shrink: 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #BBC7B4;
            margin-bottom: 15px;
            font-size: 1.1em;
            flex-shrink: 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        #word-cloud {
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 10px;
            background: #F8F6F2;
            border: 1px solid #DCE5DA;
        }

        .last-updated {
            text-align: center;
            color: #BBC7B4;
            margin-top: 10px;
            font-size: 0.9em;
            flex-shrink: 0;
            font-weight: 300;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 1.2em;
        }

        .error {
            text-align: center;
            color: #e74c3c;
            padding: 40px;
            font-size: 1.2em;
        }

        /* ===============================
        Wedding Floral Decorations
        ==================================*/

        :root{
            --sage:#A8B89D;
            --sage-dark:#7E8F74;
            --leaf:#6F8A67;
            --leaf2:#8DA084;
            --white:#ffffff;
            --cream:#F8F6F2;
            --blue:#D9E7F2;
        }

        /* keep decorations behind content */
        .container > *{
            position: relative;
            z-index: 2;
        }

        .floral{
            position:absolute;
            background-repeat:no-repeat;
            background-size:contain;
            background-position:center;
            pointer-events:none;
        }

        .floral-top-left{
            z-index:999;
            width:280px;
            height:170px;
            left:-10px;
            top:-20px;
            background-image:url("./resource/top-left.png");
        }

        .floral-top-right{
            z-index:999;
            width:250px;
            height:150px;
            right:30px;
            top:-10px;
            background-image:url("./resource/top-right.png");
        }

        .floral-bottom-left{
            width:220px;
            height:120px;
            left:-10px;
            bottom:-20px;
            background-image:url("./resource/bottom-left.png");
        }

        .floral-bottom-right{
            width:270px;
            height:120px;
            right:-10px;
            bottom:-20px;
            background-image:url("./resource/bottom-right.png");
        }

        .vine-left{
            visibility:collapse;
            z-index:999;
            position:absolute;
            left:-20px;
            top:110px;
            width:160px;
            height:420px;
            background:url("./resource/vine-left.png") no-repeat center/contain;
        }

        .vine-right{
            visibility:collapse;
            z-index:999;
            position:absolute;
            right:10px;
            top:110px;
            width:170px;
            height:420px;
            background:url("./resource/vine-right.png") no-repeat center/contain;
        }
        
        .bottom-garland{
            visibility:collapse;
            height:42px;
            margin-top:10px;
            border-radius:30px;
            background:
                radial-gradient(circle at 20px 20px,#6F8A67 0 10px,transparent 11px),
                radial-gradient(circle at 45px 12px,#8FA682 0 8px,transparent 9px),
                radial-gradient(circle at 70px 22px,#7E8F74 0 10px,transparent 11px);
            background-size:90px 42px;
            opacity:.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>不负眷顾 终木成林</h1>
        <p class="subtitle">Kit Mun & Yong Xuan</p>
        <div id="word-cloud"></div>
        <div class="bottom-garland"></div>
        <p class="last-updated" id="last-updated">Loading...</p>
    </div>

    <!-- Decorative Florals -->
    <div class="floral floral-top-left"></div>
    <div class="floral floral-top-right"></div>
    <div class="floral floral-bottom-left"></div>
    <div class="floral floral-bottom-right"></div>

    <div class="vine vine-left"></div>
    <div class="vine vine-right"></div>

    <!-- ECharts and echarts-wordcloud -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>

    <script>
        const WORKER_API_URL = '/api/word-cloud';
        const POLL_INTERVAL = 5000; // 5 seconds

        let chart = null;
        let lastData = null;

        function initChart() {
            const chartDom = document.getElementById('word-cloud');
            chart = echarts.init(chartDom);

            const option = {
                tooltip: {
                    show: true,
                    formatter: function (params) {
                        return `${params.name}: ${params.value} 次`;
                    }
                },
                series: [{
                    type: 'wordCloud',
                    shape: 'circle',
                    left: 'center',
                    top: 'center',
                    width: '90%',
                    height: '85%',
                    right: null,
                    bottom: null,
                    sizeRange: [20, 80],
                    rotationRange: [-45, 45],
                    rotationStep: 15,
                    gridSize: 8,
                    drawOutOfBound: false,
                    layoutAnimation: true,
                    textStyle: {
                        fontFamily: 'Microsoft YaHei, SimHei, PingFang SC, Noto Sans CJK, sans-serif',
                        fontWeight: 'normal',
                        color: function () {
                            const colors = [
                                '#7E8F74', '#BBC7B4', '#DCE5DA', '#A8B89D',
                                '#9AAE8F', '#8FA682', '#7E8F74', '#6B7A62'
                            ];
                            return colors[Math.floor(Math.random() * colors.length)];
                        }
                    },
                    emphasis: {
                        focus: 'self',
                        textStyle: {
                            shadowBlur: 10,
                            shadowColor: '#333'
                        }
                    },
                    data: []
                }]
            };

            chart.setOption(option);

            // Resize handler
            window.addEventListener('resize', () => {
                chart.resize();
            });
        }

        async function fetchWordCloud() {
            try {
                const response = await fetch(WORKER_API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching word cloud:', error);
                throw error;
            }
        }

        function updateChart(data) {
            if (!chart) return;

            // Check if data has changed
            const currentDataStr = JSON.stringify(data.words);
            if (currentDataStr === JSON.stringify(lastData)) {
                console.log('Data unchanged, skipping update');
                return;
            }

            lastData = data.words;

            // Transform data for echarts-wordcloud format
            const chartData = data.words.map(item => ({
                name: item.text,
                value: item.count
            }));

            // Update chart
            chart.setOption({
                series: [{
                    data: chartData
                }]
            });

            // Update last updated time
            const lastUpdated = document.getElementById('last-updated');
            const updateTime = new Date(data.updated_at);
            lastUpdated.textContent = `Last updated: ${updateTime.toLocaleString('zh-CN')}`;
        }

        async function loadWordCloud() {
            try {
                const data = await fetchWordCloud();
                updateChart(data);
            } catch (error) {
                console.error('Error loading word cloud:', error);
                const lastUpdated = document.getElementById('last-updated');
                lastUpdated.textContent = 'Error loading word cloud. Retrying...';
            }
        }

        function startPolling() {
            // Initial load
            loadWordCloud();

            // Poll for updates
            setInterval(loadWordCloud, POLL_INTERVAL);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            startPolling();
        });
    </script>
</body>
</html>
