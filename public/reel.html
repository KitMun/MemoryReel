<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精彩瞬间 - Highlight Reel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F8F6F2;
            font-family: 'Microsoft YaHei', SimHei, PingFang SC, Noto Sans CJK, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(126, 143, 116, 0.15);
            max-width: 1400px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 30px;
            border: 1px solid #DCE5DA;
            position: relative;
        }

        .left-panel {
            flex: 0 0 250px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right-panel {
            flex: 0 0 250px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            color: #7E8F74;
            margin-bottom: 5px;
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #BBC7B4;
            font-size: 0.9em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .video-wrapper {
            flex: 1;
            max-height: 85vh;
            background: #F8F6F2;
            border-radius: 15px;
            border: 1px solid #DCE5DA;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        video {
            max-height: 85vh;
            max-width: 100%;
            object-fit: contain;
            border-radius: 15px;
        }

        .info-panel {
            background: #F8F6F2;
            border-radius: 10px;
            border: 1px solid #DCE5DA;
            padding: 15px;
        }

        .info-panel h3 {
            color: #7E8F74;
            font-size: 0.9em;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .info-item {
            color: #7E8F74;
            font-size: 0.85em;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .info-item span {
            color: #BBC7B4;
            margin-left: 5px;
        }

        .loading {
            text-align: center;
            color: #BBC7B4;
            font-size: 1.2em;
            font-weight: 300;
            padding: 40px;
        }

        .error {
            text-align: center;
            color: #e74c3c;
            font-size: 1.2em;
            font-weight: 300;
            padding: 40px;
        }

        .corner-decoration {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid #DCE5DA;
            opacity: 0.5;
        }

        .corner-decoration.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decoration.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-decoration.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-decoration.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="corner-decoration top-left"></div>
        <div class="corner-decoration top-right"></div>
        <div class="corner-decoration bottom-left"></div>
        <div class="corner-decoration bottom-right"></div>

        <div class="left-panel">
            <div class="info-panel">
                <h1>精彩瞬间</h1>
                <p class="subtitle">Highlight Reel</p>
            </div>
        </div>

        <div class="video-wrapper" id="video-wrapper">
            <div class="loading">加载中... Loading...</div>
        </div>

        <div class="right-panel">
            <div class="info-panel">
                <h3>播放信息</h3>
                <div class="info-item">版本 <span id="version">-</span></div>
                <div class="info-item">时长 <span id="duration">-</span></div>
                <div class="info-item">片段数 <span id="segment-count">-</span></div>
                <div class="info-item">更新时间 <span id="updated-at">-</span></div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_API_URL = '/api/reel/current';
        const POLL_INTERVAL = 30000; // 30 seconds

        let currentReelUrl = null;
        let currentVersion = null;

        async function loadReel() {
            try {
                const response = await fetch(WORKER_API_URL);
                const data = await response.json();

                if (data.error) {
                    showError('暂无精彩瞬间 - No highlight reel available yet');
                    return;
                }

                // Check if there's a new version
                if (data.version !== currentVersion) {
                    currentVersion = data.version;
                    currentReelUrl = data.reel_url;

                    // Update video
                    const videoWrapper = document.getElementById('video-wrapper');
                    videoWrapper.innerHTML = `
                        <video id="reel-video" controls autoplay playsinline>
                            <source src="${data.reel_url}" type="video/mp4">
                        </video>
                    `;

                    // Update info
                    document.getElementById('version').textContent = `v${data.version}`;
                    document.getElementById('segment-count').textContent = data.segment_count;
                    document.getElementById('duration').textContent = formatDuration(data.total_duration_ms);
                    document.getElementById('updated-at').textContent = formatTime(data.created_at);

                    console.log(`Loaded reel v${data.version}`);
                }
            } catch (error) {
                console.error('Failed to load reel:', error);
                showError('加载失败 - Failed to load reel');
            }
        }

        function showError(message) {
            const videoWrapper = document.getElementById('video-wrapper');
            videoWrapper.innerHTML = `<div class="error">${message}</div>`;
        }

        function formatDuration(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        // Initial load
        loadReel();

        // Poll for updates
        setInterval(loadReel, POLL_INTERVAL);
    </script>
</body>
</html>
